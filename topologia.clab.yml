# Topologia fisica do laboratorio: 5 roteadores FRR em 3 ASs + 1 host por roteador
# AS100: r1, r2 | AS200: r3, r4 | AS300: r5
name: redes

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/atual/daemons:/etc/frr/daemons
        - configs/atual/r1.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/atual/daemons:/etc/frr/daemons
        - configs/atual/r2.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/atual/daemons:/etc/frr/daemons
        - configs/atual/r3.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    r4:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/atual/daemons:/etc/frr/daemons
        - configs/atual/r4.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    r5:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/atual/daemons:/etc/frr/daemons
        - configs/atual/r5.conf:/etc/frr/frr.conf
        - configs/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    pc1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1
    pc2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route replace default via 192.168.2.1
    pc3:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route replace default via 192.168.3.1
    pc4:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.4.10/24 dev eth1
        - ip route replace default via 192.168.4.1
    pc5:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.5.10/24 dev eth1
        - ip route replace default via 192.168.5.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/24
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.0.13.0/24
    - endpoints: ["r1:eth3", "pc1:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]   # 10.0.24.0/24
    - endpoints: ["r2:eth3", "pc2:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]   # 10.0.34.0/24
    - endpoints: ["r3:eth3", "r5:eth1"]   # 10.0.35.0/24
    - endpoints: ["r3:eth4", "pc3:eth1"]
    - endpoints: ["r4:eth3", "r5:eth2"]   # 10.0.45.0/24
    - endpoints: ["r4:eth4", "pc4:eth1"]
    - endpoints: ["r5:eth3", "pc5:eth1"]
