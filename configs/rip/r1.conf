frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description link r1-r2 (AS100-AS100)
 ip address 10.0.12.1/24
!
interface eth2
 description link r1-r3 (AS100-AS200)
 ip address 10.0.13.1/24
!
interface eth3
 description rede de acesso pc1
 ip address 192.168.1.1/24
!
router rip
 version 2
 network lo
 network eth1
 network eth2
 network eth3
 passive-interface eth3
!
line vty
!
