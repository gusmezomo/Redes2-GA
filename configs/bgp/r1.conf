frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description link r1-r2 (AS100-AS100)
 ip address 10.0.12.1/24
!
interface eth2
 description link r1-r3 (AS100-AS200)
 ip address 10.0.13.1/24
!
interface eth3
 description rede de acesso pc1
 ip address 192.168.1.1/24
!
router bgp 100
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 100
 neighbor 10.0.12.2 description iBGP com r2
 neighbor 10.0.13.3 remote-as 200
 neighbor 10.0.13.3 description eBGP com r3
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
  network 10.0.12.0/24
  network 10.0.13.0/24
  network 192.168.1.0/24
  neighbor 10.0.12.2 next-hop-self
 exit-address-family
!
line vty
!
