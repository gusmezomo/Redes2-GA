frr defaults traditional
hostname r2
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description link r2-r1 (AS100-AS100)
 ip address 10.0.12.2/24
!
interface eth2
 description link r2-r4 (AS100-AS200)
 ip address 10.0.24.2/24
!
interface eth3
 description rede de acesso pc2
 ip address 192.168.2.1/24
!
router bgp 100
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 100
 neighbor 10.0.12.1 description iBGP com r1
 neighbor 10.0.24.4 remote-as 200
 neighbor 10.0.24.4 description eBGP com r4
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  network 10.0.12.0/24
  network 10.0.24.0/24
  network 192.168.2.0/24
  neighbor 10.0.12.1 next-hop-self
 exit-address-family
!
line vty
!
