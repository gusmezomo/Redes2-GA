frr defaults traditional
hostname r1
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
!
interface eth1
 description link r1-r2 (AS100-AS100)
 ip address 10.0.12.1/24
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description link r1-r3 (AS100-AS200)
 ip address 10.0.13.1/24
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description rede de acesso pc1
 ip address 192.168.1.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.1
!
line vty
!
