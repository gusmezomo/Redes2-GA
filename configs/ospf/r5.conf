frr defaults traditional
hostname r5
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.5/32
 ip ospf area 0
!
interface eth1
 description link r5-r3 (AS300-AS200)
 ip address 10.0.35.5/24
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 description link r5-r4 (AS300-AS200)
 ip address 10.0.45.5/24
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth3
 description rede de acesso pc5
 ip address 192.168.5.1/24
 ip ospf area 0
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.5
!
line vty
!
